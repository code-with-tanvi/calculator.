<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        .calculator {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .display {
            width: 100%;
            height: 40px;
            margin-bottom: 20px;
            padding: 10px;
            font-size: 24px;
            font-weight: bold;
            text-align: right;
            background-color: #fff;
            border: 1px solid #ccc;
        }
        .button {
            width: 60px;
            height: 40px;
            margin: 5px;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="modal" id="calculatorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Calculator</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="calculator">
                        <input type="text" id="display" class="display" disabled>
                        <div class="row">
                            <button class="button" onclick="clickButton('7')">7</button>
                            <button class="button" onclick="clickButton('8')">8</button>
                            <button class="button" onclick="clickButton('9')">9</button>
                            <button class="button" onclick="clickButton('/')">/</button>
                        </div>
                        <div class="row">
                            <button class="button" onclick="clickButton('4')">4</button>
                            <button class="button" onclick="clickButton('5')">5</button>
                            <button class="button" onclick="clickButton('6')">6</button>
                            <button class="button" onclick="clickButton('*')">*</button>
                        </div>
                        <div class="row">
                            <button class="button" onclick="clickButton('1')">1</button>
                            <button class="button" onclick="clickButton('2')">2</button>
                            <button class="button" onclick="clickButton('3')">3</button>
                            <button class="button" onclick="clickButton('-')">-</button>
                        </div>
                        <div class="row">
                            <button class="button" onclick="clickButton('0')">0</button>
                            <button class="button" onclick="clickButton('.')">.</button>
                            <button class="button" onclick="clickButton('=')">=</button>
                            <button class="button" onclick="clickButton('+')">+</button>
                        </div>
                        <div class="row">
                            <button class="button" onclick="clearDisplay()">C</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#calculatorModal">
        Open Calculator
    </button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let display = document.getElementById('display');
        let currentNumber = '';
        let previousNumber = '';
        let operation = '';

        function clickButton(value) {
            if (value === '=') {
                calculate();
            } else if (value === 'C') {
                clearDisplay();
            } else if (['+', '-', '*', '/'].includes(value)) {
                operation = value;
                previousNumber = currentNumber;
                currentNumber = '';
                display.value = previousNumber + ' ' + operation;
            } else {
                currentNumber += value;
                if (previousNumber === '') {
                    display.value = currentNumber;
                } else {
                    display.value = previousNumber + ' ' + operation + ' ' + currentNumber;
                }
            }
        }

        function calculate() {
            if (operation === '+') {
                display.value = parseFloat(previousNumber) + parseFloat(currentNumber);
            } else if (operation === '-') {
                display.value = parseFloat(previousNumber) - parseFloat(currentNumber);
            } else if (operation === '*') {
                display.value = parseFloat(previousNumber) * parseFloat(currentNumber);
            } else if (operation === '/') {
                display.value = parseFloat(previousNumber) / parseFloat(currentNumber);
            }
            previousNumber = display.value;
            currentNumber = '';
            operation = '';
        }

        function clearDisplay() {
            display.value = '';
            currentNumber = '';
            previousNumber = '';
            operation = '';
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === '+') {
                operation = '+';
                previousNumber = currentNumber;
                currentNumber = '';
                display.value = previousNumber + ' +';
            } else if (event.key === '-') {
                operation = '-';
                previousNumber = currentNumber;
                currentNumber = '';
                display.value = previousNumber + ' -';
            } else if (event.key === '*') {
                operation = '*';
                previousNumber = currentNumber;
                currentNumber = '';
                display.value = previousNumber + ' *';
            } else if (event.key === '/') {
                operation = '/';
                previousNumber = currentNumber;
                currentNumber = '';
                display.value = previousNumber + ' /';
            } else if (event.key === '=' || event.key === 'Enter') {
                calculate();
            } else if (event.key === 'Backspace') {
                clearDisplay();
            } else if (!isNaN(event.key) || event.key === '.') {
                currentNumber += event.key;
                if (previousNumber === '') {
                    display.value = currentNumber;
                } else {
                    display.value = previousNumber + ' ' + operation + ' ' + currentNumber;
                }
            }
        });
    </script>
</body>
</html>
